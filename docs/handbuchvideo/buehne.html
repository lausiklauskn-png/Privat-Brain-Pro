<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bühne — Private Brain Pro Erklärvideo</title>
<style>
/* Bühne für die Aufnahme. Größe kommt aus ?w=&h= (quer 1920×1080, hochkant 1080×1920).
   Die App läuft im iframe #app; nichts auf der Bühne liegt ÜBER der App außer der
   Hand und dem Klick-Ring (Klaus: „nichts abdecken"). Texte stehen im Band darunter. */
:root{--rot:#34416b;--rot-d:#1f3d47;--ink:#161a24;--mint:#b8935a}
html,body{margin:0;overflow:hidden;background:#101216;font-family:"Inter","DejaVu Sans",system-ui,sans-serif}
/* overflow:CLIP, nicht hidden (Klaus 2026-09-28: Band hochkant abgeschnitten): „hidden" ist ein Rollbereich —
   rollt die App im iframe ein Element ins Bild (scrollIntoView), während die Kamera zoomt, rollte die GANZE Bühne
   mit, samt Band (gemessen 915 px nach links). „clip" schneidet ab, ohne zu rollen. */
#stage{position:relative;overflow:clip;
  background:radial-gradient(ellipse at 18% 22%,rgba(52,65,107,.16),transparent 46%),radial-gradient(ellipse at 84% 78%,rgba(184,147,90,.14),transparent 48%),linear-gradient(160deg,#eceef2,#d9dce2 55%,#caced6)}
/* Hintergrund: von ChatGPT gezeichnet (Klaus 2026-09-28), hell, Mitte frei */

.blase{position:absolute;border-radius:50%;opacity:.42;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.92),rgba(150,158,190,.6) 20%,rgba(52,62,104,.72) 58%,rgba(22,27,52,.85));box-shadow:inset -10px -14px 30px rgba(10,12,30,.35),0 14px 30px rgba(20,24,50,.18);animation:schweben 18s ease-in-out infinite}
@keyframes schweben{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-60px)}}

#kamera{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.45,.05,.2,1)}
#geraet{position:absolute;background:#0b0c0f;border-radius:38px;padding:22px;
  box-shadow:0 30px 70px rgba(30,40,70,.35),inset 0 0 0 2px #2c2f37,0 0 0 1px #000}
#geraet::before{content:"";position:absolute;left:50%;top:9px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#23262e}
#schirm{position:relative;overflow:hidden;border-radius:18px;background:#fff}
#app{display:block;border:0;background:#fff;transform-origin:0 0}

/* Erklärband unter dem Gerät */
#band{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#bandText{max-width:88%;background:#fff;color:var(--ink);border-radius:999px;padding:14px 34px;
  font-size:30px;font-weight:700;line-height:1.25;text-align:center;box-shadow:0 10px 30px rgba(30,40,70,.18);
  border:4px solid var(--rot);opacity:0;transform:translateY(24px) scale(.96);
  transition:opacity .45s ease,transform .5s cubic-bezier(.2,1.4,.4,1)}
#bandText.an{opacity:1;transform:none}
#bandText b{color:var(--rot)}
#kapitel{position:absolute;color:var(--ink);font-weight:800;letter-spacing:.02em;opacity:0;transition:opacity .5s}
#kapitel.an{opacity:.92}
#kapitel .nr{display:inline-block;background:var(--rot);border-radius:12px;padding:10px 4px;margin-inline-end:14px}

/* Hand und Klick-Ring */
/* Zwei Hände (ChatGPT, Klaus 2026-09-28): „zeigen" (Seitenansicht) weist hin,
   „tippen" (Handrücken mit W-FloH©) führt eine Aktion aus. Beim Wechsel dreht sie sich. */
#hand{position:absolute;left:0;top:0;width:110px;pointer-events:none;z-index:50;
  filter:drop-shadow(6px 10px 8px rgba(30,40,70,.30));will-change:transform}
#hand .dreh{position:relative;transition:transform .15s ease-in}
#hand.dreht .dreh{transform:scaleX(0)}
#hand img{position:absolute;left:0;top:0;width:110px;display:none;transition:transform .12s ease}
#hand[data-art="zeigen"] .zeigen,#hand[data-art="tippen"] .tippen{display:block}
#hand .zeigen{transform-origin:5px 5px}#hand .tippen{transform-origin:5px 4px}
#hand.drueckt img{transform:scale(.86)}
.ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:5px solid var(--rot);
  pointer-events:none;z-index:49;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0}}

/* Titelkarten und Übergänge: eine Ebene über allem */
#karte,#karteAlt{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--rot),var(--rot-d));color:#fff;text-align:center;visibility:hidden}
#karte .floh,#karteAlt .floh{position:relative;width:260px;height:260px}
#karte .floh::after,#karteAlt .floh::after{content:"";position:absolute;inset:18px;border-radius:52px;background:url(pb-logo.png) center/cover no-repeat;box-shadow:0 24px 60px rgba(0,0,0,.35)}
/* Weißer Kreisschatten hinter dem roten Floh, wie auf dem Titelblatt des Handbuchs (Klaus 2026-09-28: rot auf Rot
   kaum zu sehen). Dort 36 deckungsgleiche Kreise mit 3 % Deckkraft — innen addieren sie sich, außen läuft es aus.
   Dieselben Stufen als Verlauf: Durchmesser 1,33 × Floh. Kreis in ::before, Floh in ::after — so liegt der Floh
   immer darüber, auch wenn .hopst/.winkt die Ebene per transform zu einem eigenen Stapel machen. */
#karte .floh::before,#karteAlt .floh::before{content:"";position:absolute;inset:-43px;border-radius:50%;
  background:radial-gradient(circle closest-side,rgba(255,255,255,.67),rgba(255,255,255,.61) 25%,rgba(255,255,255,.47) 50%,rgba(255,255,255,.26) 75%,rgba(255,255,255,0))}
#karte h1,#karteAlt h1{font-size:92px;margin:8px 0 0;letter-spacing:-.02em}
#karte h1 span,#karteAlt h1 span{font-weight:400}
#karte p,#karteAlt p{font-size:38px;margin:10px 0 0;opacity:.95}
#karte .knr,#karteAlt .knr{font-size:40px;font-weight:700;opacity:.85;margin:0}
#karte .adresse,#karteAlt .adresse{font-size:30px;margin-top:26px;background:#fff;color:var(--rot);border-radius:999px;padding:10px 30px;font-weight:700}
/* Diaschau: eine Folie je Funktion, Symbol groß, zwei Zeilen Text */
#karte.folie,#karteAlt.folie{background:linear-gradient(150deg,#ffffff,#f3f5fa);color:var(--ink)}
#karte.folie .sym,#karteAlt.folie .sym{font-size:150px;line-height:1;margin-bottom:18px}
#karte.folie h1,#karteAlt.folie h1{font-size:74px;color:var(--rot)}
#karte.folie p,#karteAlt.folie p{font-size:36px;max-width:78%;opacity:.85}
#karte.folie .zaehler,#karteAlt.folie .zaehler{position:absolute;bottom:46px;font-size:26px;letter-spacing:.3em;opacity:.5}
.hopst{animation:hopsen 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hopsen{0%{transform:translateY(-500px) rotate(-20deg)}60%{transform:translateY(0) rotate(6deg)}80%{transform:translateY(-30px)}100%{transform:none}}
.winkt{animation:winken 1.2s ease-in-out infinite}
@keyframes winken{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.auf{animation:auf .7s .25s cubic-bezier(.2,1,.3,1) both}
@keyframes auf{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="blase" style="left:6%;top:70%;width:220px;height:220px"></div>
  <div class="blase" style="left:82%;top:8%;width:300px;height:300px;animation-delay:-6s"></div>
  <div class="blase" style="left:90%;top:62%;width:120px;height:120px;animation-delay:-11s"></div>
  <div class="blase" style="left:2%;top:8%;width:150px;height:150px;animation-delay:-3s"></div>
  <div class="blase" style="left:48%;top:88%;width:90px;height:90px;animation-delay:-9s"></div>
  <div id="kamera">
    <div id="geraet"><div id="schirm"><iframe id="app" title="Private Brain Pro"></iframe><canvas id="wechsel" hidden style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5"></canvas></div></div>
  </div>
  <canvas id="puzzle" style="position:absolute;left:0;top:0;pointer-events:none;z-index:46"></canvas>
  <div id="kapitel"></div>
  <div id="band"><div id="bandText"></div></div>
  <div id="hand" data-art="zeigen"><div class="dreh"><img class="zeigen" src="hand-zeigen.png" alt=""><img class="tippen" src="hand-tippen.png" alt=""></div></div>
  <div id="karte"></div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
  const hoch = H > W;
  // App-Fenster: quer ein Tablet (1280×800), hochkant ein Handy (412×732, 9:16) vergrößert.
  // Hochkant wird der Zoom aus dem Platz GERECHNET: oben die Kapitelzeile, unten das Band.
  // Vorher stand 2,05 fest bei 860 px Höhe — das Gerät endete bei 1957 px, unter dem Bildrand.
  const appW = +q.get('aw') || (hoch ? 412 : 1280), appH = +q.get('ah') || (hoch ? 732 : 800);
  const OBEN = 140, UNTEN = 300;                       // hochkant: Platz für Kapitel und Band
  const zoomApp = hoch ? Math.min((H - OBEN - UNTEN - 44) / appH, (W * 0.86 - 44) / appW) : 1;
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px'; if (hoch) stage.classList.add('hoch');
  const app = document.getElementById('app'), schirm = document.getElementById('schirm');
  const geraet = document.getElementById('geraet'), kamera = document.getElementById('kamera');
  app.style.width = appW + 'px'; app.style.height = appH + 'px'; app.style.transform = `scale(${zoomApp})`;
  schirm.style.width = appW * zoomApp + 'px'; schirm.style.height = appH * zoomApp + 'px';
  const gW = appW * zoomApp + 44, gH = appH * zoomApp + 44;
  const bandH = hoch ? 230 : 150;
  const gx = (W - gW) / 2, gy = hoch ? OBEN : Math.max(24, (H - bandH - gH) / 2);
  geraet.style.left = gx + 'px'; geraet.style.top = gy + 'px';
  const band = document.getElementById('band');
  band.style.top = (gy + gH + (hoch ? 36 : 26)) + 'px';
  window.__geraet = { gx, gy, gW, gH, zoomApp };      // für die Probe: das Gerät muss ganz im Bild liegen
  const kap = document.getElementById('kapitel');
  kap.style.fontSize = (hoch ? 44 : 30) + 'px';
  if (hoch) {   // hochkant: eigene weiße Plakette über dem Zoom, sonst läuft die vergrößerte App durch die Schrift
    kap.style.left = '50%'; kap.style.transform = 'translateX(-50%)'; kap.style.top = '34px'; kap.style.zIndex = '60';
    kap.style.background = '#fff'; kap.style.borderRadius = '999px'; kap.style.padding = '8px 30px 8px 10px';
    kap.style.whiteSpace = 'nowrap'; kap.style.boxShadow = '0 8px 24px rgba(30,40,70,.18)'; }
  else { kap.style.left = '40px'; kap.style.top = '40px'; kap.style.writingMode = 'vertical-rl'; kap.style.transform = 'rotate(180deg)'; kap.style.top = '60px'; }
  if (hoch) document.getElementById('bandText').style.fontSize = '42px';


  // ── Kapitelwechsel: kleine bunte 3D-Puzzleteile mit Leuchtfäden, wie im Werbefilm (Klaus 2026-10-23:
  //    „nur in kleinen Elementen, sodass man nicht abgelenkt wird … es soll Spaß machen, der Seitenwechsel“) ──
  const pz = document.getElementById('puzzle'); pz.width = W; pz.height = H; const g = pz.getContext('2d');
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eOut = x => 1 - Math.pow(1 - x, 3);
  const eBack = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const HUES = [168, 200, 262, 320, 38, 140, 290, 186];
  function stueck(w, h, m, top, right, bottom, left) {
    const t = Math.min(w, h) * .22, P = new Path2D();
    const edge = (x0, y0, x1, y1, s) => { if (!s) { P.lineTo(x1, y1); return; }
      const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = uy * s, ny = -ux * s, c = L / 2;
      const pt = (a, b) => [x0 + ux * a + nx * b, y0 + uy * a + ny * b];
      P.lineTo(...pt(c - t * .55, 0)); P.bezierCurveTo(...pt(c - t * .35, 0), ...pt(c - t * .95, t * .9), ...pt(c, t * 1.05));
      P.bezierCurveTo(...pt(c + t * .95, t * .9), ...pt(c + t * .35, 0), ...pt(c + t * .55, 0)); P.lineTo(x1, y1); };
    P.moveTo(m, m); edge(m, m, m + w, m, top); edge(m + w, m, m + w, m + h, right); edge(m + w, m + h, m, m + h, bottom); edge(m, m + h, m, m, left); P.closePath();
    return P;
  }
  let lauf = 0;
  function puzzleUebergang(seed) {
    const r = rng(seed * 7919 + 13), C = 3, R = 2, cs = 40, m = 12, id = ++lauf;
    const cx = hoch ? W - 150 : 150, cy = hoch ? 150 : (gy + gH * .5);
    const he = [], ve = []; for (let j = 0; j < R; j++) { he.push([]); ve.push([]); for (let i = 0; i < C; i++) { he[j].push(r() < .5 ? 1 : -1); ve[j].push(r() < .5 ? 1 : -1); } }
    const teile = [];
    for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
      const top = j ? -he[j - 1][i] : 0, bottom = j < R - 1 ? he[j][i] : 0, left = i ? -ve[j][i - 1] : 0, right = i < C - 1 ? ve[j][i] : 0;
      const an = r() * 6.283, dist = 260 + r() * 260;
      teile.push({ P: stueck(cs, cs, m, top, right, bottom, left), x: cx + (i - C / 2) * cs, y: cy + (j - R / 2) * cs, hue: HUES[(i * 3 + j * 5 + seed) % 8],
        dx: Math.cos(an) * dist, dy: Math.sin(an) * dist * .8, rot: (r() - .5) * 5, wob: r() * 6.28, d0: .05 + (i + j * C) * .07,
        ox: (r() - .5) * 2, oy: -.6 - r() * .8, orot: (r() - .5) * 4 });
    }
    const t0 = performance.now(), DAUER = 2000, ZACK = .95;
    (window.__puzzleTon = window.__puzzleTon || []).push(t0);
    const faeden = [0, 1].map(k => ({ x1: hoch ? W / 2 + (k - .5) * 300 : gx + 6, y1: hoch ? gy + 6 : gy + gH * (.3 + .4 * k), bend: k ? .28 : -.25, hue: k ? 262 : 186 }));
    const male = now => {
      if (id !== lauf) return; const t = (now - t0) / 1000; g.clearRect(0, 0, W, H);
      if (t * 1000 > DAUER) return;
      // Leuchtfäden vom fertigen Puzzle zum Gerät, mit wanderndem Licht
      for (const f of faeden) { const age = t - ZACK - .05; if (age < 0) continue;
        const a = 1 - clamp((age - .55) / .45), k = eOut(clamp(age / .45));
        const mx = (cx + f.x1) / 2 - (f.y1 - cy) * f.bend, my = (cy + f.y1) / 2 + (f.x1 - cx) * f.bend;
        const qx = u => (1 - u) * (1 - u) * cx + 2 * (1 - u) * u * mx + u * u * f.x1, qy = u => (1 - u) * (1 - u) * cy + 2 * (1 - u) * u * my + u * u * f.y1;
        g.save(); g.lineCap = 'round'; g.shadowColor = `hsla(${f.hue},90%,60%,${a})`; g.shadowBlur = 14;
        g.strokeStyle = `hsla(${f.hue},85%,58%,${.75 * a})`; g.lineWidth = 2.6; g.beginPath(); g.moveTo(cx, cy);
        for (let u = 0; u <= k; u += .04) g.lineTo(qx(u), qy(u)); g.stroke();
        const u = clamp(age / .6); g.fillStyle = `hsla(${f.hue},100%,75%,${a})`; g.beginPath(); g.arc(qx(u), qy(u), 5, 0, 7); g.fill(); g.restore(); }
      // Teile: fliegen auf Spiralen herein, rasten ein, schweben danach auseinander
      for (const p of teile) {
        const x = clamp((t - p.d0) / (ZACK - p.d0)), e = eBack(x), q = 1 - e, w = t > ZACK + .45 ? eOut(clamp((t - ZACK - .45) / .6)) : 0;
        if (x <= 0) continue;
        const sp = Math.sin(q * 5 + p.wob) * 60 * q, sq = Math.cos(q * 4 + p.wob) * 40 * q;
        const px = p.x + p.dx * q + sp + p.ox * 120 * w, py = p.y + p.dy * q + sq + p.oy * 120 * w, sc = (.45 + .55 * clamp(e)) * (1 - .4 * w);
        g.save(); g.globalAlpha = clamp(x * 3) * (1 - w); g.translate(px + cs / 2 + m, py + cs / 2 + m); g.rotate(p.rot * q + p.orot * w); g.scale(sc, sc); g.translate(-cs / 2 - m, -cs / 2 - m);
        for (let k = 3; k >= 1; k--) { g.save(); g.translate(k * 1.6, k * 2.2); g.fillStyle = `hsl(${p.hue},70%,${34 - k * 5}%)`; g.fill(p.P); g.restore(); }   // Dicke
        const gr = g.createLinearGradient(m, m, m + cs, m + cs); gr.addColorStop(0, `hsl(${p.hue},90%,72%)`); gr.addColorStop(1, `hsl(${p.hue + 25},80%,52%)`);
        g.fillStyle = gr; g.shadowColor = `hsla(${p.hue},90%,60%,.55)`; g.shadowBlur = 10; g.fill(p.P);
        g.shadowBlur = 0; g.globalAlpha *= .55; g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.ellipse(m + cs * .34, m + cs * .28, cs * .2, cs * .1, -.6, 0, 7); g.fill();   // Glanz
        g.restore();
      }
      // Zack: ein Ring und kleine Funken, wenn die Teile einrasten
      const za = t - ZACK; if (za >= 0 && za < .6) { const k = eOut(za / .6), a = 1 - za / .6;
        g.save(); g.strokeStyle = `hsla(186,90%,55%,${a})`; g.lineWidth = 3 * a + 1; g.beginPath(); g.ellipse(cx, cy, 30 + 90 * k, 24 + 64 * k, 0, 0, 7); g.stroke();
        for (let i = 0; i < 9; i++) { const an = i / 9 * 6.283 + seed, rr = 34 + 70 * k; g.fillStyle = `hsla(${HUES[i % 8]},95%,60%,${a})`; g.beginPath(); g.arc(cx + Math.cos(an) * rr, cy + Math.sin(an) * rr * .8, 3.5 * a + 1, 0, 7); g.fill(); }
        g.restore(); }
      requestAnimationFrame(male);
    };
    requestAnimationFrame(male);
  }

  // ── Seitenwechsel als Puzzle (Klaus 2026-10-23: „lebendig von allen Seiten kommend … Farben von Private Brain Pro …
  //    man soll sehen, wie es sich zusammensetzt … am Ende kommt die Seite heraus, die bedient werden soll …
  //    jedes Mal ein anderer Übergang“). Die neue Seite liegt als Bild vor; ihre Teile fliegen herein, tragen
  //    unterwegs eine Private-Brain-Farbe und werden beim Einrasten zur echten Seite. Danach liegt darunter die App. ──
  const wc = document.getElementById('wechsel'), wg = wc.getContext('2d');
  const SW = appW * zoomApp, SH = appH * zoomApp; wc.width = SW; wc.height = SH;
  const PBF = ['#5a4330', '#3d4a6b', '#2f5d62', '#7a6347', '#4a4f5a', '#6b5a44', '#33505e', '#584a3a'];   // gedeckte App-Farben, dunkler (Klaus: „seriös … etwas dunkler als die App“)
  const ladeBild = u => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = u; });
  let altBild = null;
  function hintergrund(a) {      // heller Private-Brain-Grund wie die Bühne, mit weichem Leuchten und Fäden
    const gr = wg.createLinearGradient(0, 0, SW, SH); gr.addColorStop(0, '#ece6ff'); gr.addColorStop(1, '#dcf3f1');
    wg.globalAlpha = a; wg.fillStyle = gr; wg.fillRect(0, 0, SW, SH);
    for (const [x, y, rr, c] of [[.2, .3, .5, '91,67,201'], [.8, .75, .5, '43,179,163'], [.6, .15, .35, '120,90,230']]) {
      const g2 = wg.createRadialGradient(x * SW, y * SH, 0, x * SW, y * SH, rr * SW); g2.addColorStop(0, `rgba(${c},.28)`); g2.addColorStop(1, `rgba(${c},0)`); wg.fillStyle = g2; wg.fillRect(0, 0, SW, SH); }
    wg.strokeStyle = 'rgba(91,67,201,.12)'; wg.lineWidth = 2;
    for (let k = 0; k < 7; k++) { wg.beginPath(); for (let x = -20; x <= SW + 20; x += 20) { const y = SH * (k + .5) / 7 + Math.sin(x / 140 + k * 1.7) * 38 + Math.sin(x / 61 + k) * 9; x < 0 ? wg.moveTo(x, y) : wg.lineTo(x, y); } wg.stroke(); }
    wg.globalAlpha = 1;
  }
  const ARTEN = [
    { C: 8, R: 5, n: 'spirale' }, { C: 10, R: 6, n: 'regen' }, { C: 8, R: 5, n: 'seiten' }, { C: 9, R: 6, n: 'explosion' },
    { C: 10, R: 6, n: 'welle' }, { C: 8, R: 5, n: 'kippen' }, { C: 9, R: 5, n: 'klick' }, { C: 10, R: 6, n: 'wirbel' }];
  async function puzzleSeite(neuUrl, artNr, ox, oy) {
    const neu = await ladeBild(neuUrl), A = ARTEN[artNr % ARTEN.length], r = rng(artNr * 977 + 5);
    const { C, R } = A, cw = SW / C, ch = SH / R, m = Math.min(cw, ch) * .3;
    const he = [], ve = []; for (let j = 0; j < R; j++) { he.push([]); ve.push([]); for (let i = 0; i < C; i++) { he[j].push(r() < .5 ? 1 : -1); ve[j].push(r() < .5 ? 1 : -1); } }
    const teile = [];
    for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
      const top = j ? -he[j - 1][i] : 0, bottom = j < R - 1 ? he[j][i] : 0, left = i ? -ve[j][i - 1] : 0, right = i < C - 1 ? ve[j][i] : 0;
      const tx = i * cw, ty = j * ch, cx = tx + cw / 2, cy = ty + ch / 2, an = r() * 6.283;
      const p = { P: stueck(cw, ch, m, top, right, bottom, left), tx, ty, cx, cy, farbe: PBF[(i * 3 + j * 5 + artNr) % PBF.length],
        rot: (r() - .5) * 1.2, sc: .82 + r() * .12, wob: r() * 6.28, sx: 0, sy: 0, d: 0, spin: 0 };
      const dc = Math.hypot(cx - SW / 2, cy - SH / 2) / Math.hypot(SW / 2, SH / 2);
      switch (A.n) {
        case 'spirale': { const dist = 170 + r() * 170; p.sx = cx + Math.cos(an) * dist; p.sy = cy + Math.sin(an) * dist * .8; p.d = r() * .95; p.swirl = 1; break; }
        case 'regen': p.sx = cx + (r() - .5) * 60; p.sy = cy - 140 - r() * 140; p.d = i * .055 + r() * .35; break;
        case 'seiten': p.sx = cx + (j % 2 ? 1 : -1) * (220 + r() * 160); p.sy = cy + (r() - .5) * 40; p.d = j * .09 + (j % 2 ? C - i : i) * .05; break;
        case 'explosion': p.sx = cx + (SW / 2 - cx) * .3; p.sy = cy + (SH / 2 - cy) * .3; p.sc = .6; p.d = dc * .8 + r() * .15; break;
        case 'welle': p.sx = cx + 180 + r() * 140; p.sy = cy + 120 + r() * 100; p.d = ((C - i) + (R - j)) * .055 + r() * .1; break;
        case 'kippen': p.sx = cx; p.sy = cy - 40 - r() * 40; p.sc = .55; p.rot = (r() < .5 ? -1 : 1) * (.5 + r() * .4); p.d = (i + j) * .06 + r() * .08; break;
        case 'klick': p.sx = cx + (ox - cx) * .35; p.sy = cy + (oy - cy) * .35; p.sc = .6; p.d = Math.hypot(cx - ox, cy - oy) / Math.hypot(SW, SH) * 1.1 + r() * .12; p.swirl = .5; break;
        case 'wirbel': { const a0 = Math.atan2(cy - SH / 2, cx - SW / 2), rr = Math.hypot(cx - SW / 2, cy - SH / 2) + 160 + r() * 120; p.sx = SW / 2 + Math.cos(a0) * rr; p.sy = SH / 2 + Math.sin(a0) * rr * .8; p.spin = .7; p.d = (1 - dc) * .6 + r() * .25; break; }
      }
      teile.push(p);
    }
    const maxD = Math.max(...teile.map(p => p.d)); for (const p of teile) p.d = .2 + p.d / maxD * .75;   // alle starten zwischen 0,2 und 0,95 s
    const FLUG = .95, ENDE = .95 + FLUG + .15, t0 = performance.now();
    (window.__puzzleTon = window.__puzzleTon || []).push(t0);
    const gelandet = [];
    wc.hidden = false;
    await new Promise(fertig => {
      const male = now => {
        const t = (now - t0) / 1000; wg.clearRect(0, 0, SW, SH);
        wg.fillStyle = '#f5f0e6'; wg.fillRect(0, 0, SW, SH);   // Grund wie die App; die alte Seite blendet langsam aus
        if (altBild) { const a = 1 - eOut(clamp(t / 1.3)); if (a > 0) { wg.save(); wg.globalAlpha = a; const s2 = 1 - .015 * (1 - a); wg.translate(SW / 2, SH / 2); wg.scale(s2, s2); wg.drawImage(altBild, -SW / 2, -SH / 2, SW, SH); wg.restore(); } }
        // gelandete Teile zuerst (flach), fliegende darüber (mit Dicke und Farbe)
        const order = teile.map(p => ({ p, x: clamp((t - p.d) / FLUG) })).sort((a, b) => (a.x >= 1 ? 0 : 1) - (b.x >= 1 ? 0 : 1));
        for (const { p, x } of order) {
          if (x <= 0) continue;
          const e = eOut(x), q = 1 - e;
          let px = p.sx + (p.tx + cw / 2 - p.sx) * e, py = p.sy + (p.ty + ch / 2 - p.sy) * e;
          if (p.swirl) { px += Math.sin(q * 4 + p.wob) * 50 * q * p.swirl; py += Math.cos(q * 3 + p.wob) * 36 * q * p.swirl; }
          if (p.spin) { const a = Math.atan2(py - SH / 2, px - SW / 2) - p.spin * q, d = Math.hypot(px - SW / 2, py - SH / 2); px = SW / 2 + Math.cos(a) * d; py = SH / 2 + Math.sin(a) * d; }
          const sc = p.sc + (1 - p.sc) * e, rot = p.rot * q, farbe = 1 - clamp((x - .4) / .6);
          wg.save(); wg.globalAlpha = .15 + .85 * eOut(clamp(x * 1.4)); wg.translate(px, py); wg.rotate(rot); wg.scale(sc, sc); wg.translate(-cw / 2 - m, -ch / 2 - m);
          if (farbe > 0) { wg.save(); wg.translate(1.5 * farbe, 2.5 * farbe); wg.fillStyle = `rgba(20,24,40,${.25 * farbe})`; wg.fill(p.P); wg.restore(); }   // leichter Schatten statt dicker Farbschichten
          wg.save(); wg.clip(p.P); wg.drawImage(neu, p.tx - m, p.ty - m, cw + 2 * m, ch + 2 * m, 0, 0, cw + 2 * m, ch + 2 * m);
          if (farbe > 0) { wg.globalAlpha *= .5 * farbe; wg.fillStyle = p.farbe; wg.fillRect(0, 0, cw + 2 * m, ch + 2 * m); }
          wg.restore();
          const glanz = clamp(1 - Math.abs(x - .9) * 5); if (glanz > 0) { wg.strokeStyle = `rgba(184,147,90,${.45 * glanz})`; wg.lineWidth = 1.5; wg.stroke(p.P); }
          wg.restore();
          if (x >= 1 && !p.land) { p.land = t; gelandet.push(p); }
        }
        // Leuchtfäden zwischen den zuletzt eingerasteten Teilen, mit wanderndem Licht
        for (let k = 1; k < gelandet.length; k++) { const a0 = gelandet[k - 3] || gelandet[0], b0 = gelandet[k], age = t - b0.land; if (age > .8) continue; if (k % 7) continue;
          const al = 1 - clamp((age - .35) / .65), kk = eOut(clamp(age / .35)), bend = (k % 4 ? .3 : -.3);
          const mx = (a0.cx + b0.cx) / 2 - (b0.cy - a0.cy) * bend, my = (a0.cy + b0.cy) / 2 + (b0.cx - a0.cx) * bend;
          const qx = u => (1 - u) * (1 - u) * a0.cx + 2 * (1 - u) * u * mx + u * u * b0.cx, qy = u => (1 - u) * (1 - u) * a0.cy + 2 * (1 - u) * u * my + u * u * b0.cy;
          wg.save(); wg.lineCap = 'round'; wg.strokeStyle = `rgba(184,147,90,${.55 * al})`; wg.lineWidth = 1.6;
          wg.beginPath(); wg.moveTo(a0.cx, a0.cy); for (let u = 0; u <= kk; u += .05) wg.lineTo(qx(u), qy(u)); wg.stroke();
          const u = clamp(age / .5); wg.fillStyle = `rgba(214,184,130,${al})`; wg.beginPath(); wg.arc(qx(u), qy(u), 3.5, 0, 7); wg.fill(); wg.restore(); }
        // Zack: wenn alles sitzt, ein heller Ring über die Seite
        const za = t - (ENDE - .35); if (za > 0) { const k = eOut(clamp(za / .35)), a = 1 - k; wg.save(); wg.strokeStyle = `rgba(184,147,90,${.3 * a})`; wg.lineWidth = 3 * a + 1;
          wg.beginPath(); wg.ellipse(SW / 2, SH / 2, 60 + SW * .6 * k, 40 + SH * .6 * k, 0, 0, 7); wg.stroke(); wg.restore(); }
        if (t < ENDE) requestAnimationFrame(male); else { wc.hidden = true; altBild = null; fertig(); }
      };
      requestAnimationFrame(male);
    });
  }

  const warte = ms => new Promise(r => setTimeout(r, ms));
  const hand = document.getElementById('hand');
  let hx = W * 0.8, hy = H + 200;          // Hand wartet unten rechts außerhalb
  // Fingerspitze im Bild (bei 110 px Breite), je Hand gemessen
  const SPITZE = { zeigen: [5, 5], tippen: [5, 4] };
  const setzeHand = (x, y) => { hx = x; hy = y; const [sx, sy] = SPITZE[hand.dataset.art]; hand.style.transform = `translate(${x - sx}px,${y - sy}px)`; };
  // Wechsel zwischen den beiden Händen: kurz auf die Kante drehen, tauschen, zurückdrehen
  async function art(neu) {
    if (hand.dataset.art === neu) return;
    hand.classList.add('dreht'); await warte(150);
    hand.dataset.art = neu; setzeHand(hx, hy);
    hand.classList.remove('dreht'); await warte(150);
  }
  setzeHand(hx, hy);

  const B = window.B = {
    W, H, hoch,
    appFenster: () => app.contentWindow,
    laden: url => new Promise(r => { app.onload = () => r(); app.src = url; }),
    // Lage eines Elements der App in Bühnen-Koordinaten (Zoom und Verschiebung eingerechnet)
    rect(sel) {
      const d = app.contentDocument; const el = typeof sel === 'string' ? d.querySelector(sel) : sel;
      if (!el) return null;
      const r = el.getBoundingClientRect(), f = app.getBoundingClientRect();
      const s = f.width / app.clientWidth;
      return { x: f.left + r.left * s, y: f.top + r.top * s, w: r.width * s, h: r.height * s };
    },
    // Hand gleitet auf einer weichen Kurve zum Ziel
    art,
    // haelt=true: die Hand führt gerade etwas aus (Ziehen) und bleibt beim Handrücken
    async handZu(x, y, ms, haelt) {
      if (!haelt && hand.dataset.art !== 'zeigen') art('zeigen');   // unterwegs zeigt sie, dreht sich dabei zurück
      const x0 = hx, y0 = hy, dist = Math.hypot(x - x0, y - y0);
      ms = ms || Math.min(1050, Math.max(450, dist * 0.75));
      const cx = (x0 + x) / 2 + (y - y0) * 0.18, cy = (y0 + y) / 2 - Math.abs(x - x0) * 0.12 - 40;
      const t0 = performance.now();
      await new Promise(res => {
        const schritt = t => {
          let p = Math.min(1, (t - t0) / ms); const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
          const u = 1 - e; setzeHand(u * u * x0 + 2 * u * e * cx + e * e * x, u * u * y0 + 2 * u * e * cy + e * e * y);
          p < 1 ? requestAnimationFrame(schritt) : res();
        };
        requestAnimationFrame(schritt);
      });
    },
    async druck() {
      await art('tippen');                                  // zur Aktion dreht sie sich auf den Handrücken
      hand.classList.add('drueckt');
      const r = document.createElement('div'); r.className = 'ring'; r.style.left = hx + 'px'; r.style.top = hy + 'px';
      stage.appendChild(r); setTimeout(() => r.remove(), 700);
      window.__klicks = (window.__klicks || []).concat(performance.now());
      await warte(140); hand.classList.remove('drueckt');
    },
    handWeg: () => B.handZu(W * 0.86, H + 220, 900),
    text(html) {
      const t = document.getElementById('bandText');
      if (!html) { t.classList.remove('an'); return; }
      if (t.classList.contains('an')) { t.classList.remove('an'); setTimeout(() => { t.innerHTML = html; t.classList.add('an'); }, 280); }
      else { t.innerHTML = html; t.classList.add('an'); }
    },
    kapitel(nr, titel) { kap.dataset.nr = nr || ''; kap.innerHTML = nr ? `<span class="nr">${nr}</span>${titel}` : ''; kap.classList.toggle('an', !!nr); },
    // Zoom auf einen Ausschnitt (Bühnen-Koordinaten), null = zurück
    // Seitenwechsel: altes Bild über die App legen (vor dem Klick), dann die neue Seite als Puzzle zusammensetzen
    async wechselAlt(url) { altBild = await ladeBild(url); wg.clearRect(0, 0, SW, SH); wg.drawImage(altBild, 0, 0, SW, SH); wc.hidden = false; },
    wechselVerbergen(an) { wc.style.visibility = an ? 'hidden' : ''; },
    wechselPuzzle: (url, art, ox, oy) => puzzleSeite(url, art, ox, oy),
    kameraSofort(transform) { kamera.style.transition = 'none'; const alt = kamera.style.transform; kamera.style.transform = transform; void kamera.offsetWidth; return alt; },
    kameraWeich() { void kamera.offsetWidth; kamera.style.transition = ''; },
    zoom(r, faktor) {
      if (!r) { kamera.style.transform = ''; return; }
      const f = faktor || 1.8; const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      let tx = W / 2 - cx * f, ty = (H - bandH) / 2 - cy * f;
      kamera.style.transform = `translate(${tx}px,${ty}px) scale(${f})`;
    },
    // Titelkarte mit wechselnden Übergängen hinein und hinaus
    async karte(html, rein, raus, halten, klasse) {
      const k = document.getElementById('karte');
      // Folie auf Folie: die alte bleibt als Kopie darunter stehen, bis die neue ganz da
      // ist — sonst blitzt beim Hereinwischen die App zwischen zwei Folien auf.
      let alt = null;
      if (klasse === 'folie' && k.style.visibility === 'visible' && k.className === 'folie') {
        alt = k.cloneNode(true); alt.removeAttribute('id'); alt.id = 'karteAlt';
        alt.style.zIndex = '79'; alt.style.visibility = 'visible'; alt.querySelectorAll('.auf').forEach(e => e.classList.remove('auf'));
        k.parentNode.insertBefore(alt, k);
      }
      // Endzustand des letzten Übergangs nicht erben. cancel() allein reichte im langen
      // Lauf nicht: die Unschärfe vom Anfang hing nach 200 s noch an der Karte
      // (gemessen mit DIAG=1). Deshalb zusätzlich alles ausdrücklich zurücksetzen.
      B.karteSauber(k);
      k.className = klasse || '';
      k.innerHTML = html; k.style.visibility = 'visible';
      await B.bewege(k, rein, true);
      B.karteSauber(k);                                    // angekommen: keine Füllung stehen lassen
      if (alt) alt.remove();
      await warte(halten || 1500);
      if (raus) { await B.bewege(k, raus, false); k.style.visibility = 'hidden'; B.karteSauber(k); }
    },
    async kartenWeg(raus) { const k = document.getElementById('karte'); await B.bewege(k, raus, false); k.style.visibility = 'hidden'; B.karteSauber(k); },
    karteSauber(k) {
      k.getAnimations().forEach(a => a.cancel());
      k.style.filter = 'none'; k.style.transform = 'none'; k.style.clipPath = 'none'; k.style.opacity = '1';
    },
    bewege(el, art, hinein) {
      const X = hx, Y = hy;
      const arten = {
        blende: [{ opacity: 0 }, { opacity: 1 }],
        wisch: [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }],
        wischHoch: [{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0% 0 0 0)' }],
        schieben: [{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }],
        fliessen: [{ transform: 'translateY(-100%) skewY(-6deg)', filter: 'blur(12px)' }, { transform: 'none', filter: 'blur(0)' }],
        iris: [{ clipPath: `circle(0px at ${X}px ${Y}px)` }, { clipPath: `circle(${Math.hypot(W, H)}px at ${X}px ${Y}px)` }],
        irisMitte: [{ clipPath: `circle(0px at 50% 50%)` }, { clipPath: `circle(${Math.hypot(W, H)}px at 50% 50%)` }],
        blaettern: [{ transform: 'perspective(2400px) rotateY(-95deg)', transformOrigin: 'left center' }, { transform: 'perspective(2400px) rotateY(0deg)', transformOrigin: 'left center' }],
      };
      const k = arten[art] || arten.blende;
      const a = el.animate(hinein ? k : [...k].reverse(), { duration: 800, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' });
      return a.finished;
    },
    warte,
  };
  window.__bereit = true;
})();
</script>
</body>
