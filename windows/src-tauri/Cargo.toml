[package]
name = "private-brain-pro"
version = "1.0.43"
description = "Private Brain Pro für Windows"
edition = "2021"
publish = false
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
base64 = "0.22"
zeroize = "1"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_Media_Speech",
  "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects",
  "Networking_Connectivity", "Media_SpeechRecognition", "Globalization", "Foundation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
messprobe = []
