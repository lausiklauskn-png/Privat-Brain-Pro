<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src ipc: http://ipc.localhost https://ipc.localhost; form-action 'none'; base-uri 'none'; frame-src 'none'">
<title>Private Brain Pro</title><link rel="stylesheet" href="dialog.css"><script src="dialog.js" defer></script></head>
<body><main><h1 id="title">Private Brain Pro</h1><form id="form">
<div id="account" hidden>
<label><span id="provider-label">Anbieter</span><select id="provider"><option value="telekom">Telekom / T-Online</option><option value="hetzner">Hetzner</option><option value="gmail">Google / Gmail</option><option value="webde">WEB.DE</option><option value="gmx">GMX</option><option value="yahoo">Yahoo Mail</option><option value="ionos">1&amp;1 / IONOS</option></select></label>
<p id="help"></p><div id="account-fields"><label><span id="email-caption">E-Mail</span><input id="email" type="email" autocomplete="username" maxlength="254"></label><label id="user-label"><span id="user-caption">Benutzername</span><input id="user" maxlength="320"></label><label>IMAP<input id="imap" maxlength="253"></label><label>SMTP<input id="smtp" maxlength="253"></label></div></div>
<label id="password-label"><span id="password-caption">Passwort</span><input id="password" type="password" autocomplete="off" maxlength="4096"></label>
<label id="repeat-label"><span id="repeat-caption">Passwort wiederholen</span><input id="repeat" type="password" autocomplete="off" maxlength="4096"></label>
<label id="notice-label" class="check"><input id="notice" type="checkbox"><span id="notice-caption"></span></label>
<label id="remember-label" class="check"><input id="remember" type="checkbox"><span id="remember-caption"></span></label>
<p id="status" role="status"></p><div class="actions"><button id="cancel" type="button">Abbrechen</button><button id="remove" type="button" hidden>Entfernen</button><button id="submit" type="submit">Weiter</button></div>
</form></main></body></html>
