name: Verschlüsselte Vorschau-Signierung prüfen
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  encrypted-signing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          python3 -m venv "$RUNNER_TEMP/pb-age"
          "$RUNNER_TEMP/pb-age/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/signing/requirements.txt
      - run: node --test tools/signing/test-*.mjs
        env:
          PB_SIGNING_PYTHON: ${{ runner.temp }}/pb-age/bin/python
