name: Android und Web-Prüfungen
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix mail-service --ignore-scripts
      - name: Browser installieren
        run: npx playwright-core install --with-deps chromium
      - name: Vollständige vorhandene Web-Prüfungen
        run: |
          export CB_CHROMIUM="$(node --input-type=module -e 'import {chromium} from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          export WFPDF_KLON="$GITHUB_WORKSPACE/tests/fixtures/Workflow-PDF"
          npm test
          npm run sync:android
          npm run test:native-web
      - run: npm test --prefix mail-service
      - run: ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-nur-entwicklung
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
