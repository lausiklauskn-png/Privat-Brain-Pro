name: Private Brain Pro für Windows – Bau und Abnahme
on:
  pull_request:
    paths: ['windows/**','native/**','android/app/src/main/java/**','tools/native/**','.github/workflows/windows-app.yml']
  push:
    branches: ['main','codex/windows-native-host']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: node windows/engine/test.mjs
      - run: node windows/engine/protocol-test.mjs
  windows:
    runs-on: windows-latest
    steps:
      - name: Gemeinsame Quellen ohne Zeilenumwandlung auschecken
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix windows
      - name: Echte Browserverbindungen in Hauptfenster und isolierten Frames
        run: node windows/pruefung/network.mjs
      - name: Rust-Abhängigkeiten und Zwischenergebnisse
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: windows/src-tauri -> target
          cache-on-failure: true
      - name: CI-Launcher und normale Benutzerrechte vor dem App-Bau prüfen
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path (Join-Path (Get-Location) 'windows/pruefung/upgrade-launcher.cs')
          [UpgradeProbeLauncher]::Preflight()
          Write-Output 'PASS CI-only medium-integrity launcher compiles and its unchanged-user context is valid'
      - name: Unveränderten veröffentlichten 1.0.36-Installer vor dem App-Bau starten
        timeout-minutes: 8
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File windows/pruefung/legacy-startup.ps1
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-legacy-startup
          path: windows/pruef-out/legacy-startup/
          if-no-files-found: ignore
          retention-days: 30
      - name: Gemeinsamer Kern auf dem Windows-Dateisystem
        run: node windows/engine/test.mjs
      - name: Eigene Windows-Laufzeit ohne zusätzliche Nutzerinstallation
        run: node windows/tools/prepare-runtime.mjs
      - name: Privates Kindprozessprotokoll mit der tatsächlich gebündelten Laufzeit
        run: node windows/engine/protocol-test.mjs windows/runtime/jre/bin/java.exe windows/runtime
      - name: Tauri-Prüfbau mit WebView2
        run: npm run tauri --prefix windows -- build --bundles nsis --features messprobe
      - name: Installierte Grundfunktionen, Neustart und Neuinstallation
        timeout-minutes: 20
        run: ./windows/pruefung/installed.ps1
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-installationspruefung
          path: windows/pruef-out/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-aufbau-nur-pruefbau
          path: |
            windows/src-tauri/target/release/bundle/nsis/*
            windows/engine/build/shared-source.json
          if-no-files-found: error
          retention-days: 14
      - name: Auslieferungsbau ohne Prüfzugang
        run: npm run tauri --prefix windows -- build --bundles nsis
      - name: Veröffentlichten 1.0.38-Installer wirklich auf 1.0.39 aktualisieren
        timeout-minutes: 15
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File windows/pruefung/upgrade.ps1
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-upgrade-36-37
          path: windows/pruef-out/upgrade-36-37/
          if-no-files-found: ignore
          retention-days: 30
      - name: Tatsächlichen Auslieferungsbau installieren, starten und entfernen
        run: ./windows/pruefung/production.ps1
      - name: Unverwechselbaren Installer und Prüfsummen vorbereiten
        run: node windows/tools/distribution.mjs
        env:
          PB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: windows/distribution/
          if-no-files-found: error
          retention-days: 30
