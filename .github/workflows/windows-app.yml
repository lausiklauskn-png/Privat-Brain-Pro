name: Windows-App (im Aufbau)
on:
  pull_request:
    paths: ['windows/**','native/**','android/app/src/main/java/**','tools/native/**','.github/workflows/windows-app.yml']
  push:
    branches: ['codex/windows-native-host']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: node windows/engine/test.mjs
  windows:
    runs-on: windows-latest
    steps:
      - name: Gemeinsame Quellen ohne Zeilenumwandlung auschecken
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix windows
      - name: Gemeinsamer Kern auf dem Windows-Dateisystem
        run: node windows/engine/test.mjs
      - name: Eigene Windows-Laufzeit ohne zusätzliche Nutzerinstallation
        run: node windows/tools/prepare-runtime.mjs
      - name: Tauri-Prüfbau mit WebView2
        run: npm run tauri --prefix windows -- build --bundles nsis --features messprobe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-aufbau-nur-pruefbau
          path: |
            windows/src-tauri/target/release/bundle/nsis/*
            windows/engine/build/shared-source.json
          if-no-files-found: error
          retention-days: 14
